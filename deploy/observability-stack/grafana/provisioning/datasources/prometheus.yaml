apiVersion: 1

datasources:
  - name: Prometheus
    # Stable UID so dashboard JSON (generated by `mcp-toolkit
    # gen-dashboards`) can reference this datasource without guessing
    # Grafana's auto-generated hash.
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
