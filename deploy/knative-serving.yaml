apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: mcp-toolkit
  namespace: mcp-toolkit
  annotations:
    # Concurrency-target autoscaling. Tune per workload.
    autoscaling.knative.dev/target: "50"
    autoscaling.knative.dev/min-scale: "0"
    autoscaling.knative.dev/max-scale: "20"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/target: "50"
    spec:
      containers:
        - image: ghcr.io/<your-username-or-org>/mcp-toolkit:latest
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: LOG_LEVEL
              value: "info"
            - name: TOKEN_STORE
              value: "upstash"
            - name: METRICS_ENABLED
              value: "1"
            - name: TENANT_STRATEGY
              value: "single"
            # Inject Upstash credentials from a Secret you provision.
            - name: UPSTASH_REDIS_REST_URL
              valueFrom:
                secretKeyRef:
                  name: mcp-toolkit-secrets
                  key: upstash-url
            - name: UPSTASH_REDIS_REST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mcp-toolkit-secrets
                  key: upstash-token
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
