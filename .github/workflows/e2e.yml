name: E2E

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"  # nightly 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  e2e:
    name: End-to-end suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --group dev --extra observability
      - name: Run E2E suite
        id: e2e
        # `continue-on-error` so the workflow can still build + upload the
        # report on failure. The final job conclusion is set by the
        # `Fail job on test failure` step at the end.
        continue-on-error: true
        run: |
          mkdir -p docs
          set -o pipefail
          uv run pytest tests/e2e -m e2e --no-cov 2>&1 | tee /tmp/pytest.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Build E2E report
        if: always()
        run: |
          mkdir -p docs
          if [ "${{ steps.e2e.outputs.exit_code }}" = "0" ]; then
            STATUS="✓ pass"
          else
            STATUS="✗ fail (exit ${{ steps.e2e.outputs.exit_code }})"
          fi
          {
            echo "# E2E test report"
            echo ""
            echo "**Status:** ${STATUS}"
            echo "**Commit:** ${{ github.sha }}"
            echo "**Run:** [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo ""
            echo "## Pytest output (tail)"
            echo ""
            echo '```'
            tail -60 /tmp/pytest.log
            echo '```'
          } > docs/E2E-REPORT.md
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: docs/E2E-REPORT.md
          if-no-files-found: warn
      - name: Comment PR with E2E summary
        if: always() && github.event_name == 'pull_request' && hashFiles('docs/E2E-REPORT.md') != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: docs/E2E-REPORT.md
      - name: Fail job on test failure
        if: always() && steps.e2e.outputs.exit_code != '0'
        run: exit 1

  stack-integration:
    name: Observability stack (compose-up smoke)
    # The compose stack adds ~2 min; only run on schedule + manual dispatch
    # so PR feedback stays fast.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --group dev --extra observability
      - name: Bring up observability stack (dev profile)
        run: |
          cd deploy/observability-stack
          docker compose -f compose.dev.yaml up -d --wait
      - name: Run integration tests against running stack
        run: uv run pytest tests/integration -m integration --no-cov -v
      - name: Compose logs on failure
        if: failure()
        run: |
          cd deploy/observability-stack
          docker compose -f compose.dev.yaml logs --no-color
      - name: Tear down
        if: always()
        run: |
          cd deploy/observability-stack
          docker compose -f compose.dev.yaml down -v
